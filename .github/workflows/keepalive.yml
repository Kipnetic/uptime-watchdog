# GitHub disables scheduled workflows in a public repository after 60 days with
# no activity. A weekly commit keeps the uptime watchdog's schedule alive.
name: Keepalive
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a timestamp
        run: |
          date -u '+%Y-%m-%dT%H:%MZ' > .keepalive
          git config user.name "watchdog-bot"
          git config user.email "watchdog-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
